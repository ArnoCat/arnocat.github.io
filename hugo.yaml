baseURL: "https://arnocat.github.io/"
title: "ArnoCat"
pagination:
  pagerSize: 9
theme: PaperMod
publishDir: "docs"

outputFormats:
  JSON:
    name: "json"
    mediaType: "application/json"
    baseName: "index"
    isPlainText: true
    notAlternative: false

outputs:
  home:
    - HTML
    - JSON
    - RSS

defaultContentLanguage: "zh"
defaultContentLanguageInSubdir: false

languages:
  zh:
    languageName: "中文"
    weight: 1
    title: "ArnoCat"
    params:
      title: "ArnoCat"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: "ArnoCat"
  description: "记录 Go、Docker、Linux、AI 与开发工作流的实践笔记。"
  keywords: [Go, Docker, Linux, Hugo, AI, Workflow]
  author: "arno"
  # author: ["Me", "You"] # multiple authors
  images: ["/favicon.ico"]
  DateFormat: "2006-01-02"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon.ico"
    favicon32x32: "/favicon.ico"
    apple_touch_icon: "/favicon.ico"
    safari_pinned_tab: "/favicon.ico"

  label:
    text: "ArnoCat"
    icon: /favicon.ico
    iconHeight: 24
  disableLangToggle: true
  displayFullLangName: false

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: "ArnoCat"
    subtitle: "Practical notes for engineers"
    imageUrl: "/favicon.ico"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "ArnoCat 的技术手记"
    Content: "聚焦 Go、Docker、Linux、AI 和开发工作流，记录真实问题、排查过程与可复用经验。"

  socialIcons:
    - name: github
      url: "https://github.com/arnocat"
      title: "GitHub"
    - name: email
      url: "mailto:q243284589@gmail.com"
      title: "Email"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

  gitalk:
    enable: false
menu:
  main:
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 10
    - identifier: about
      name: 关于
      url: /about/me/
      weight: 15
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 25
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
