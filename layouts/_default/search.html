{{- define "main" }}

<section class="search-shell">
    <header class="page-header search-hero">
        <p class="section-kicker">Find Anything</p>
        <h1>{{- (printf "%s&nbsp;" .Title ) | htmlUnescape -}}
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </h1>
        {{- if .Description }}
        <div class="post-description search-description">
            {{ .Description }}
        </div>
        {{- end }}
        <div class="search-tips">
            <span>支持标题、摘要和正文内容匹配</span>
            <span>可用 ↑ ↓ 浏览，回车或 → 打开</span>
        </div>
    </header>

    <div id="searchbox" class="search-panel">
        <input id="searchInput" autofocus placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
            aria-label="search" type="search" autocomplete="off" maxlength="64">
        <ul id="searchResults" aria-label="search results"></ul>
    </div>
</section>

{{- end }}{{/* end main */}}
